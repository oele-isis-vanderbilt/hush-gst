# Pinned FFmpeg builds for `hush ffmpeg install`.
#
# One [[target]] per platform, keyed by "<os>-<arch>" (Rust's
# std::env::consts::OS and ARCH). Each target lists one or more downloads;
# `extract` names the files taken from each archive (matched by file name,
# anywhere inside the archive).
#
# Rules:
# - Pin a fixed-version URL, never a "latest" link, and update url and sha256
#   together (`shasum -a 256 <file>`).
# - Prefer LGPL builds (BtbN "lgpl" variants for Linux and Windows). There is
#   no maintained LGPL static macOS build, so macOS uses martin-riedl.de (GPL).
#   hush only runs FFmpeg as a separate program and never links to it.
# - BtbN deletes daily builds after a few weeks but keeps month-end builds
#   (autobuild-YYYY-MM-<last day>) for about two years: pin a month-end tag.
# - The build must include the encoders hush uses: aac, flac, alac, libmp3lame,
#   libopus, libvorbis (`hush doctor` checks this).
#
# An empty url means "not pinned yet": `hush ffmpeg install` then explains how
# to use a system ffmpeg instead.
#
# Current pins: FFmpeg 9.0.2 on every platform, pinned 2026-11-04.

[[target]]
key = "macos-aarch64"
license = "GPL-3.0-or-later (martin-riedl.de static build)"
[[target.download]]
url = "https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffmpeg.zip"
sha256 = "c8ed4c4e6978a03c485edbfe4e0a5dc2380f8a30bba5150531b31b094492d924"
archive = "zip"
extract = ["ffmpeg"]
[[target.download]]
url = "https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffprobe.zip"
sha256 = "fcbe839537485eaee7a7a8bc5cbc0f90d53617e80943e8a5b2e31cb851197ea6"
archive = "zip"
extract = ["ffprobe"]


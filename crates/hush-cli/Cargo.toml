[package]
name = "hush-cli"
version = "0.1.0"
edition = "2024"
description = "Batch noise suppression for audio and video files"

[[bin]]
name = "hush"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"

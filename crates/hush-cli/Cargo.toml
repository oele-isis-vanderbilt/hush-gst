[package]
name = "hush-cli"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Batch noise suppression for audio and video files"

[[bin]]
name = "hush"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
console = "0.16.6"
ctrlc = "3.5.2"
dirs = "7.0.0"
flate2 = "1.1.10"
glob = "0.3.4"
hex = "0.4.3"
hush-core = { version = "0.0.1", path = "../hush-core" }
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
toml = "1.2.0"
ureq = "3.5.1"
which = "8.0.6"
xz2 = "0.1.7"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
hound = "3.5.1"

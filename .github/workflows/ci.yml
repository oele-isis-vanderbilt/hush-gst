name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # ffmpeg for the end-to-end tests (they skip without it).
      - name: Install ffmpeg (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macos)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: cargo clippy --locked -p hush-core -p hush-cli --all-targets --no-deps -- -D warnings
      - run: cargo test --locked --release -p hush-core -p hush-cli

  installers-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install/install.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path install/install.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

  # Build, package like the release does, then run the installer against the
  # local archive with a throwaway home directory.
  installers-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-14,      target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p hush-cli

      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name=hush-${{ matrix.target }}
          mkdir -p dist/$name home
          cp target/release/hush dist/$name/
          tar -czf dist/$name.tar.gz -C dist $name
          (cd dist && shasum -a 256 $name.tar.gz > $name.tar.gz.sha256)
          env -u ZDOTDIR HOME=$PWD/home SHELL=/bin/bash HUSH_DOWNLOAD_BASE=file://$PWD/dist sh install/install.sh
          home/.hush/bin/hush --version
          grep -q "hush installer" home/.bashrc
          env -u ZDOTDIR HOME=$PWD/home sh install/install.sh --uninstall
          test ! -e home/.hush
          ! grep -q "hush installer" home/.bashrc

      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "hush-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/hush.exe "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          $h = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          Set-Content -NoNewline "dist/$name.zip.sha256" "$h  $name.zip"
          $env:HUSH_DOWNLOAD_BASE = (Resolve-Path dist).Path
          $dir = Join-Path $env:RUNNER_TEMP 'hush'
          ./install/install.ps1 -Dir $dir -NoModifyPath
          & (Join-Path $dir 'bin/hush.exe') --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./install/install.ps1 -Dir $dir -Uninstall
          if (Test-Path $dir) { exit 1 }
